name: ci

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax check)
        run: |
          shopt -s globstar
          for f in deploy.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          version: v0.10.0
          # archive/pre-quadlet-deployment/ is the compose-era tree preserved from the
          # openclaw host. It is never installed, sourced or executed, and every file in it is
          # byte-identical to the host copy on purpose - satisfying ShellCheck there would mean
          # editing preserved files, which defeats the point of preserving them. The repository's
          # own scripts stay fully checked; only the frozen tree is skipped.
          ignore_paths: archive

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Runtime secret/config files must never be tracked
        run: |
          set -euo pipefail
          # These are generated by deploy.sh at runtime (gitignored) —
          # if one of them is ever tracked, a real secret could ship in git.
          files=(
            .env
            config/headplane/cookie-secret
            config/headplane/api-key
            config/headscale/preauth-key
            config/headscale/config.runtime.yaml
          )
          fail=0
          for f in "${files[@]}"; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is tracked in git but must stay untracked/runtime-only"
              fail=1
            fi
          done
          exit "$fail"

      - name: No private-key or live Headscale key material committed
        run: |
          set -euo pipefail
          fail=0
          if git grep -nIE 'BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY' -- . ; then
            echo "::error::private key material found in tracked files"
            fail=1
          fi
          # docs/DEPLOYMENT-REPORT.md carries a pre-existing, intentionally
          # truncated ("...") example key from a historical report — not a
          # usable secret, and out of scope for this change; excluded here.
          # archive/pre-quadlet-deployment/tree/tests/test_validate_api_key.py asserts on an
          # example API key whose body is masked with asterisks - a unit-test fixture, preserved
          # byte-identical from the openclaw host, not a usable secret. Same reason as the line
          # above. Only that one file is excluded; the rest of the preserved tree is still scanned
          # by this gate.
          if git grep -nIE 'hskey-(auth|api)-[A-Za-z0-9_-]{10,}' -- . ':!docs/DEPLOYMENT-REPORT.md' \
               ':!archive/pre-quadlet-deployment/tree/tests/test_validate_api_key.py'; then
            echo "::error::a real-looking Headscale key was committed"
            fail=1
          fi
          exit "$fail"
