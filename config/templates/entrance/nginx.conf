worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  map $uri $woow_cache_control {
    ~^/admin/assets/ $upstream_http_cache_control;
    default "no-store";
  }
  # Headplane loads dozens of fingerprinted modules at once. They are immutable,
  # read-only assets; counting them against the login/page budget makes the UI
  # intermittently return 429 before it can render. An empty key is not limited.
  map $uri $woow_rate_key {
    ~^/admin/assets/ "";
    default $binary_remote_addr;
  }
  limit_req_zone $woow_rate_key zone=woow_entrance:2m rate=5r/s;
  limit_req_status 429;
  # Headplane starts after the container enters the running state. Do not cache
  # an early connection refusal as a dead upstream during the readiness probe.
  upstream headplane_ui { server headplane:3000 max_fails=0; }

  server {
    listen 3000;
    server_name _;
    absolute_redirect off;
    client_max_body_size 10m;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control $woow_cache_control always;
    auth_basic "Headscale";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    location = /healthz { auth_basic off; access_log off; return 200 "ok\n"; }
    location = /healthz-upstream {
      auth_basic off;
      access_log off;
      proxy_pass http://headplane_ui/admin/healthz;
    }
    location = / {
      limit_req zone=woow_entrance burst=50 nodelay;
      return 302 /admin/;
    }
    location / {
      limit_req zone=woow_entrance burst=50 nodelay;
      proxy_pass http://headplane_ui;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Remote-User "admin";
      proxy_set_header Remote-Email "";
      proxy_set_header Remote-Name "";
      proxy_set_header Remote-Picture "";
      proxy_set_header Authorization "";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cache-Control;
    }
  }

  # Only the private Podman network can reach this port. An optional ngrok
  # agent dials it, and the filter intentionally omits admin/API/Swagger paths.
  server {
    listen 8081;
    server_name _;
    access_log off;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    location = /ts2021 { proxy_pass http://headscale:8080; }
    location = /key { proxy_pass http://headscale:8080; }
    location = /health { proxy_pass http://headscale:8080; }
    location = /verify { proxy_pass http://headscale:8080; }
    location ^~ /register/ { proxy_pass http://headscale:8080; }
    location ^~ /machine/ { proxy_pass http://headscale:8080; }
    location = /register { return 404; }
    location = /machine { return 404; }
    location = /derp { proxy_pass http://headscale:8080; }
    location ^~ /derp/ { proxy_pass http://headscale:8080; }
    location / { return 404; }
  }
}
