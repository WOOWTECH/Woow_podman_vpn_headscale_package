# Headplane 0.7.0 configuration. Rendered by scripts/install.sh to
# ~/.config/headscale/headplane/config.yaml and bind-mounted read-only at
# /etc/headplane/config.yaml.
#
# Both file paths below are podman secrets mounted by quadlet/headplane.container, so no
# credential is ever written into this repository or into ~/.config.
#
# Do not add an `integration:` block: Headplane 0.7.0 validates its Kubernetes fields even
# when the integration is disabled, and refuses to start.
server:
  host: "0.0.0.0"
  port: 3000
  cookie_secret_path: "/etc/headplane/cookie-secret"
  cookie_secure: @@HEADPLANE_COOKIE_SECURE@@

headscale:
  url: "http://headscale:8080"
  api_key_path: "/etc/headplane/api-key"
